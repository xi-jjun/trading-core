spring.application.name=trading-core

# Active profiles: local/sandbox
# Profile-specific DB settings are in application-{profile}.properties
# Common DB settings are in application-db.properties (loaded via spring.config.import)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# DB Common
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.table=flyway_schema_history
