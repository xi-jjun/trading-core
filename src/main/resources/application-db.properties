# Database Configuration - Default/Common Settings (PostgreSQL)
# This file contains common DB settings that apply to all profiles
# Profile-specific settings can override these in:
# - application-local.properties (for local profile)
# - application-sandbox.properties (for sandbox profile)

spring.datasource.driver-class-name=org.postgresql.Driver

# Default Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Default JPA/Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.use_sql_comments=${JPA_USE_SQL_COMMENTS:false}

# Default Flyway Migration Settings
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# flyway default migration ? ?? X
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.table=flyway_schema_history
